<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-label="执行图重放中的存储与结果所有权">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#5a6980"/></marker></defs>
<rect width="1400" height="800" fill="#fff"/>
<text x="42" y="45" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#18253e" text-anchor="start"><tspan x="42" dy="0">执行图重放中的存储与结果所有权</tspan></text>
<text x="42" y="78" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5a6980" text-anchor="start"><tspan x="42" dy="0">执行图复用运算安排；当前输入、当前参数和调用方结果都有明确的生命周期。</tspan></text>
<rect x="45" y="150" width="230" height="110" rx="12" fill="#edf4ff" stroke="#bccbdc"/><text x="160.0" y="184" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#18253e" text-anchor="middle"><tspan x="160.0" dy="0">当前输入</tspan></text><text x="160.0" y="215" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5a6980" text-anchor="middle"><tspan x="160.0" dy="0">新图像 / 当前特征</tspan></text>
<path d="M282 205 L307 205" fill="none" stroke="#5a6980" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="315" y="150" width="230" height="110" rx="12" fill="#e9f7f3" stroke="#bccbdc"/><text x="430.0" y="184" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#18253e" text-anchor="middle"><tspan x="430.0" dy="0">静态输入 buffer</tspan></text><text x="430.0" y="215" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5a6980" text-anchor="middle"><tspan x="430.0" dy="0">地址固定，内容更新</tspan></text>
<path d="M552 205 L577 205" fill="none" stroke="#5a6980" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="585" y="150" width="230" height="110" rx="12" fill="#e9f7f3" stroke="#bccbdc"/><text x="700.0" y="184" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#18253e" text-anchor="middle"><tspan x="700.0" dy="0">graph replay</tspan></text><text x="700.0" y="215" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5a6980" text-anchor="middle"><tspan x="700.0" dy="0">重算本次网络结果</tspan></text>
<path d="M822 205 L847 205" fill="none" stroke="#5a6980" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="855" y="150" width="230" height="110" rx="12" fill="#e9f7f3" stroke="#bccbdc"/><text x="970.0" y="184" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#18253e" text-anchor="middle"><tspan x="970.0" dy="0">静态输出 buffer</tspan></text><text x="970.0" y="215" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5a6980" text-anchor="middle"><tspan x="970.0" dy="0">下次 replay 将覆盖</tspan></text>
<path d="M1092 205 L1117 205" fill="none" stroke="#5a6980" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1125" y="150" width="230" height="110" rx="12" fill="#edf4ff" stroke="#bccbdc"/><text x="1240.0" y="184" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#18253e" text-anchor="middle"><tspan x="1240.0" dy="0">调用方独立输出</tspan></text><text x="1240.0" y="215" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5a6980" text-anchor="middle"><tspan x="1240.0" dy="0">异步发送可继续持有</tspan></text>
<text x="296" y="130" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5a6980" text-anchor="middle"><tspan x="296" dy="0">copy_</tspan></text>
<text x="1105" y="130" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5a6980" text-anchor="middle"><tspan x="1105" dy="0">clone</tspan></text>
<rect x="585" y="345" width="230" height="110" rx="12" fill="#fff3e3" stroke="#bccbdc"/><text x="700.0" y="379" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#18253e" text-anchor="middle"><tspan x="700.0" dy="0">当前参数存储</tspan></text><text x="700.0" y="410" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5a6980" text-anchor="middle"><tspan x="700.0" dy="0">原位更新后读取新值</tspan></text>
<path d="M700 337 L700 270" fill="none" stroke="#5a6980" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="560" width="410" height="150" rx="12" fill="#edf4ff" stroke="#bccbdc"/><text x="250.0" y="594" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#18253e" text-anchor="middle"><tspan x="250.0" dy="0">输入签名</tspan></text><text x="250.0" y="625" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5a6980" text-anchor="middle"><tspan x="250.0" dy="0">区分 shape、dtype、device 与结构</tspan><tspan x="250.0" dy="23.2">输入内容每次复制更新</tspan><tspan x="250.0" dy="23.2">不支持的输入走 eager</tspan></text>
<rect x="495" y="560" width="410" height="150" rx="12" fill="#edf4ff" stroke="#bccbdc"/><text x="700.0" y="594" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#18253e" text-anchor="middle"><tspan x="700.0" dy="0">随机采样边界</tspan></text><text x="700.0" y="625" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5a6980" text-anchor="middle"><tspan x="700.0" dy="0">本方案把噪声生成留在图外</tspan><tspan x="700.0" dy="23.2">图内保留确定性网络区域</tspan><tspan x="700.0" dy="23.2">核对原有 RNG 顺序</tspan></text>
<rect x="945" y="560" width="410" height="150" rx="12" fill="#edf4ff" stroke="#bccbdc"/><text x="1150.0" y="594" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#18253e" text-anchor="middle"><tspan x="1150.0" dy="0">调用层管理生命周期</tspan></text><text x="1150.0" y="625" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5a6980" text-anchor="middle"><tspan x="1150.0" dy="0">移动或替换参数 storage 前释放图</tspan><tspan x="1150.0" dy="23.2">需要时按新存储重新捕获</tspan><tspan x="1150.0" dy="23.2">完整计时包含输入和输出复制</tspan></text>
</svg>