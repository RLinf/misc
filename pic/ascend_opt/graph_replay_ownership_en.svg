<text x="42" y="78" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#5a6980" text-anchor="start"><tspan x="42" dy="0">Replay reuses an execution plan; current inputs, parameters and caller outputs have explicit lifetimes.</tspan></text>
