<rect x="945" y="560" width="410" height="150" rx="12" fill="#edf4ff" stroke="#bccbdc"/><text x="1150.0" y="594" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#18253e" text-anchor="middle"><tspan x="1150.0" dy="0">Caller owns the lifecycle</tspan></text><text x="1150.0" y="625" font-family="WenQuanYi Zen Hei, Droid Sans Fallback, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#5a6980" text-anchor="middle"><tspan x="1150.0" dy="0">Release before moving/replacing weights</tspan><tspan x="1150.0" dy="23.2">Recapture against new storage if needed</tspan><tspan x="1150.0" dy="23.2">Time input and output copies too</tspan></text>
