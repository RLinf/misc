<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" width="960" height="256" role="img" aria-label="Comparison of Collocated, Disaggregated, and Hybrid placement modes in RLinf">
  <defs>
    <linearGradient id="dm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .title { font-size: 14.5px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 11.5px; fill: #475569; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .blk { font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .pill { font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="252" rx="14" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Col 1: Collocated -->
  <rect x="18" y="18" width="296" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="18" y="18" width="296" height="6" rx="3" fill="#2563eb"/>
  <text x="34" y="48" class="t title">Collocated (Default)</text>
  <text x="34" y="66" class="t sub">All components share the same GPUs</text>
  <text x="34" y="82" class="t sub">via sequential offload and time-slicing.</text>

  <!-- Visual GPU bar -->
  <rect x="34" y="96" width="264" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="112" class="t sub" style="font-size:10px;font-weight:600;">GPU 0 … N (shared)</text>
  <rect x="44" y="118" width="76" height="20" rx="5" fill="#2563eb"/>
  <text x="82" y="132" text-anchor="middle" class="t blk">Env</text>
  <rect x="126" y="118" width="78" height="20" rx="5" fill="#0891b2"/>
  <text x="165" y="132" text-anchor="middle" class="t blk">Rollout</text>
  <rect x="210" y="118" width="78" height="20" rx="5" fill="#7c3aed"/>
  <text x="249" y="132" text-anchor="middle" class="t blk">Actor</text>

  <rect x="34" y="156" width="264" height="36" rx="6" fill="#f1f5f9"/>
  <text x="44" y="172" class="code">component_placement:</text>
  <text x="44" y="186" class="code">  actor,env,rollout: all</text>

  <rect x="34" y="202" width="184" height="22" rx="11" fill="#eff6ff"/>
  <text x="126" y="217" text-anchor="middle" class="t pill" fill="#1d4ed8">1–8 GPUs · Quickstarts</text>

  <!-- Col 2: Disaggregated -->
  <rect x="332" y="18" width="296" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="332" y="18" width="296" height="6" rx="3" fill="#0891b2"/>
  <text x="348" y="48" class="t title">Disaggregated</text>
  <text x="348" y="66" class="t sub">Each component owns dedicated GPUs</text>
  <text x="348" y="82" class="t sub">for zero offload and async overlap.</text>

  <!-- Visual GPU bars -->
  <rect x="348" y="96" width="78" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="387" y="112" text-anchor="middle" class="t sub" style="font-size:10px;">GPU 0–1</text>
  <rect x="356" y="118" width="62" height="20" rx="5" fill="#2563eb"/>
  <text x="387" y="132" text-anchor="middle" class="t blk">Env</text>

  <rect x="434" y="96" width="84" height="50" rx="8" fill="#ecfeff" stroke="#67e8f9" stroke-width="1"/>
  <text x="476" y="112" text-anchor="middle" class="t sub" style="font-size:10px;">GPU 2–3</text>
  <rect x="442" y="118" width="68" height="20" rx="5" fill="#0891b2"/>
  <text x="476" y="132" text-anchor="middle" class="t blk">Rollout</text>

  <rect x="526" y="96" width="86" height="50" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="569" y="112" text-anchor="middle" class="t sub" style="font-size:10px;">GPU 4–7</text>
  <rect x="534" y="118" width="70" height="20" rx="5" fill="#7c3aed"/>
  <text x="569" y="132" text-anchor="middle" class="t blk">Actor</text>

  <rect x="348" y="156" width="264" height="36" rx="6" fill="#f1f5f9"/>
  <text x="358" y="172" class="code">env: 0-1  rollout: 2-3</text>
  <text x="358" y="186" class="code">actor: 4-7</text>

  <rect x="348" y="202" width="210" height="22" rx="11" fill="#ecfeff"/>
  <text x="453" y="217" text-anchor="middle" class="t pill" fill="#0e7490">8+ GPUs · Async &amp; Max Throughput</text>

  <!-- Col 3: Hybrid / Heterogeneous -->
  <rect x="646" y="18" width="296" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="646" y="18" width="296" height="6" rx="3" fill="#059669"/>
  <text x="662" y="48" class="t title">Hybrid / Heterogeneous</text>
  <text x="662" y="66" class="t sub">Mix shared GPUs with separate nodes,</text>
  <text x="662" y="82" class="t sub">CPU workers, or physical robot hosts.</text>

  <!-- Visual 2-node bars -->
  <rect x="662" y="96" width="154" height="50" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="739" y="112" text-anchor="middle" class="t sub" style="font-size:10px;">GPU Node (rank 0)</text>
  <rect x="670" y="118" width="66" height="20" rx="5" fill="#0891b2"/>
  <text x="703" y="132" text-anchor="middle" class="t blk">Rollout</text>
  <rect x="742" y="118" width="66" height="20" rx="5" fill="#7c3aed"/>
  <text x="775" y="132" text-anchor="middle" class="t blk">Actor</text>

  <rect x="824" y="96" width="102" height="50" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="875" y="112" text-anchor="middle" class="t sub" style="font-size:10px;">Robot (rank 1)</text>
  <rect x="832" y="118" width="86" height="20" rx="5" fill="#059669"/>
  <text x="875" y="132" text-anchor="middle" class="t blk">Env / Arm</text>

  <rect x="662" y="156" width="264" height="36" rx="6" fill="#f1f5f9"/>
  <text x="672" y="172" class="code">actor,rollout: 0  # GPU node</text>
  <text x="672" y="186" class="code">env: franka:0     # Robot node</text>

  <rect x="662" y="202" width="210" height="22" rx="11" fill="#ecfdf5"/>
  <text x="767" y="217" text-anchor="middle" class="t pill" fill="#047857">Multi-Node · Real-World Robots</text>
</svg>
